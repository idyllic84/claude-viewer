<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Conversation Viewer</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Left Panel: Session List -->
        <div class="panel left-panel">
            <div class="panel-header">
                <h2>Sessions</h2>
                <button id="reloadBtn">Reload</button>
            </div>
            <div class="filter-bar" id="sessionFilterBar">
                <div class="filter-label">Search:</div>
                <div class="uuid-search">
                    <input type="text" id="sessionSearch" placeholder="Search sessions (press Enter)..." />
                    <button id="clearSessionSearchBtn" class="clear-btn" title="Clear search">×</button>
                </div>
            </div>
            <div class="panel-content">
                <div id="sessionList" class="session-list">
                    <div class="loading">Loading sessions...</div>
                </div>
            </div>
        </div>

        <!-- Resizer between left and middle -->
        <div class="resizer" data-direction="left"></div>

        <!-- Middle Panel: Conversation History -->
        <div class="panel middle-panel">
            <div class="panel-header">
                <h2>Conversation</h2>
            </div>
            <div class="filter-bar" id="filterBar">
                <div class="filter-label">Filter:</div>
                <div class="filter-tags" id="filterTags">
                    <!-- Filter tags will be dynamically added here -->
                </div>
                <div class="uuid-search">
                    <input type="text" id="uuidSearch" placeholder="Search messages (press Enter)..." />
                    <button id="clearUuidBtn" class="clear-btn" title="Clear search">×</button>
                </div>
            </div>
            <div class="panel-content">
                <div id="conversationHistory" class="conversation-history">
                    <div class="empty-state">
                        <p>Select a session from the left to view conversation history</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Resizer between middle and right -->
        <div class="resizer" data-direction="right"></div>

        <!-- Right Panel: Message Details -->
        <div class="panel right-panel">
            <div class="panel-header">
                <h2>Message Details</h2>
            </div>
            <div class="panel-content">
                <div id="messageDetails" class="message-details">
                    <div class="empty-state">
                        <p>Click a message to view details</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global function for wrap toggle
        function toggleWrap(event) {
            const button = event.target;
            const contentBlock = button.closest('.content-block');
            const preElement = contentBlock.querySelector('.content-text');

            if (preElement.classList.contains('no-wrap')) {
                preElement.classList.remove('no-wrap');
                button.classList.remove('active');
            } else {
                preElement.classList.add('no-wrap');
                button.classList.add('active');
            }
        }
    </script>
    <script src="static/js/app.js" type="module"></script>
</body>
</html>
